name: Tests

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install public validation tooling
        run: python -m pip install -r tools/requirements.txt

      - name: Test the template checker
        run: python -m unittest discover -s _help_and_materials -p '*_tests.py'

      - name: Validate templates with public AAS metamodel 3.1 SDK
        env:
          AAS_VERSION: "3.1"
        run: python ./_help_and_materials/check_templates.py

  release-checks:
    # Released files unchanged, AASX == JSON, README links resolve (tools/check_release.py)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r tools/requirements.txt

      - run: python tools/check_release.py --base origin/main
